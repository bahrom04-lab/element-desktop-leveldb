[package]
name = "element-desktop-leveldb"
version = "0.1.0"
edition = "2024"
license = "MIT"
homepage = "#website#"
repository = "https://github.com/bahrom04-lab/element-desktop-leveldb"
description = "Letʻs see whatʻs inside leveldb"
authors = ["bahrom04"]

[profile.release]
lto = true

[dependencies]
rusty-leveldb = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
anyhow = "1.0.102"
chrono = "0.4.44"
thiserror = "2.0.18"
# relm4 = { version = "0.9.1", features = ["macros", "libadwaita", "gnome_47"] }
# tokio = { version = "1.50", features = ["full"] }

